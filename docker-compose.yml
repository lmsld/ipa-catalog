services:
  ipa-catalog:
    image: ghcr.io/lmsld/ipa-catalog:latest
    container_name: ipa-catalog
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    restart: unless-stopped
    ports:
      - 8000:8000
    # networks:
    #   cloudflared_default:
    volumes:
      - ipa-catalog:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
volumes:
  ipa-catalog:
    name: ipa-catalog
# networks:
#   cloudflared_default:
#     external: true
